name: Lightweight checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Unity project files
        run: python3 -B -X utf8 tools/check_unity_files.py
      - name: Test local advisor
        run: python3 -B -X utf8 tools/advisor/test_advisor.py
